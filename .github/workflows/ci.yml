name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run tells you nothing useful, and CI minutes are finite.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Turbo's own cache is empty on a fresh runner, so every task genuinely runs.
  # That is the point: locally, a stale cache once reported "lint successful"
  # without executing lint at all.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: build · lint · typecheck · format
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile fails if the lockfile and package.json disagree,
      # which is the only way a dependency drift gets noticed before deploy.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Runs first because it regenerates the token layer. `build` includes
      # tokens:audit (every name parses against the naming spec) and
      # tokens:verify (codeSyntax matches the token path), so a token
      # regression fails here rather than in review.
      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format

      # Generated output must never differ from what the committed source
      # produces. If this fails, someone hand-edited a generated file or
      # committed an export that does not rebuild to itself.
      - name: Generated output is reproducible
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build modified tracked files — generated output is out of sync."
            git status --short
            git diff
            exit 1
          fi

  storybook:
    name: storybook builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      # Typecheck does not catch a story that throws on render, or an import
      # that only resolves through Storybook's Vite config.
      - name: Build Storybook
        run: pnpm --filter @ionbase-ui/storybook build-storybook

      # Interaction tests run the stories in a real Chromium. They assert the
      # data-attribute contract button.css depends on — before React Aria's
      # useHover/useFocusRing were wired in, the component only emitted
      # data-pressed, so [data-hovered] and [data-focused] were dead selectors
      # and nothing noticed.
      - name: Install Playwright Chromium
        run: pnpm --filter @ionbase-ui/storybook exec playwright install --with-deps chromium

      - name: Interaction tests
        run: pnpm --filter @ionbase-ui/storybook test

  # Publishes Storybook to https://raza-ahmed.github.io/ionbase-design-system/
  #
  # Depends on `storybook`, so a story that throws on render or fails an
  # interaction test never reaches the live URL — the previous deploy simply
  # stays up. Only runs on main: a PR gets the build check without republishing
  # the site out from under whoever is looking at it.
  #
  # The site is rebuilt here rather than reusing the `storybook` job's output,
  # because that job builds for `/` and this one needs the Pages subpath baked
  # into the asset URLs. Uploading the wrong one is the failure mode this
  # avoids.
  deploy-storybook:
    name: deploy storybook
    needs: storybook
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Pages deploys use a short-lived OIDC token rather than a PAT, so the job
    # needs both permissions declared. `contents: read` is the default the rest
    # of the workflow relies on and must be restated once any permission is set.
    permissions:
      contents: read
      pages: write
      id-token: write

    # One live site, so queue deploys instead of cancelling them. The
    # workflow-level `concurrency` block cancels in progress, which for a
    # deploy means a superseded run can be killed mid-upload.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # `base_path` is what Pages reports for this repo, so the subpath is not
      # duplicated here — renaming the repo does not silently break the build.
      - name: Build Storybook
        run: pnpm --filter @ionbase-ui/storybook build-storybook
        env:
          STORYBOOK_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/storybook/storybook-static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
